name: Build Opening Forge APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check ZIP exists
        run: |
          test -f opening-forge-new-clean.zip || {
            echo "ERROR: ZIP file not found"
            exit 1
          }

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o opening-forge-new-clean.zip -d project

      - name: Find Gradle wrapper
        run: |
          WRAPPER="$(find project -type f -name gradlew -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No Gradle wrapper found in the ZIP."
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "ANDROID_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: opening-forge-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
