name: Build Opening Forge APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          ls -la
          if [ ! -f opening-forge-new-clean.zip ]; then
            echo "::error::opening-forge-new-clean.zip was not found in the repository root."
            exit 1
          fi

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o opening-forge-new-clean.zip -d project
          echo "Files extracted:"
          find project -maxdepth 3 -type f | head -200

      - name: Locate Android project
        run: |
          if [ -f project/android/gradlew ]; then
            echo "ANDROID_DIR=project/android" >> "$GITHUB_ENV"
          elif [ -f project/gradlew ]; then
            echo "ANDROID_DIR=project" >> "$GITHUB_ENV"
          else
            echo "::error::Could not find Gradle wrapper. Check the extracted project structure."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: opening-forge-debug-apk
          path: |
            project/android/app/build/outputs/apk/debug/app-debug.apk
            project/app/build/outputs/apk/debug/app-debug.apk
            project/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
