name: Build Opening Forge APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check ZIP exists
        run: |
          ls -la
          test -f opening-forge-new-clean.zip || {
            echo "ERROR: ZIP file not found"
            exit 1
          }

      - name: Inspect ZIP contents
        run: |
          echo "===== ZIP CONTENTS ====="
          unzip -l opening-forge-new-clean.zip | head -100

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o opening-forge-new-clean.zip -d project

      - name: Find Android build files
        run: |
          echo "===== GRADLE FILES ====="
          find project -type f \( \
            -name gradlew -o \
            -name settings.gradle -o \
            -name settings.gradle.kts -o \
            -name build.gradle -o \
            -name build.gradle.kts \
          \) | head -100

          echo "===== PROJECT DIRECTORIES ====="
          find project -maxdepth 4 -type d | head -100

      - name: Check for Gradle wrapper
        run: |
          WRAPPER="$(find project -type f -name gradlew -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "No Gradle wrapper found in the ZIP."
            echo "The inspection output above shows the available files."
            exit 1
          fi

          echo "Found Gradle wrapper: $WRAPPER"
          echo "ANDROID_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: opening-forge-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
