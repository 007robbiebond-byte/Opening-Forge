name: Build Opening Forge APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Android SDK path
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Check Android SDK tools
        run: |
          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "ERROR: Android SDK manager was not found."
            ls -la "$ANDROID_HOME/cmdline-tools/"
            exit 1
          fi
          sdkmanager --version

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check ZIP exists
        run: |
          test -f opening-forge-new-clean.zip || {
            echo "ERROR: ZIP file not found"
            exit 1
          }

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o opening-forge-new-clean.zip -d project

      - name: Generate Gradle wrapper
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          cd project/android
          gradle wrapper --gradle-version 8.7

      - name: Build APK
        run: |
          cd project/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: opening-forge-debug-apk
          path: project/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
